<!doctype html><meta charset="utf-8"><title>Browse interaction benchmark</title>
<style>body{margin:0;font:20px system-ui;background:#fff;color:#171717}main{padding:32px}#selection{font:24px monospace;margin:20px 0;user-select:text}input{font:20px system-ui;width:380px;height:36px}button,a{font:20px system-ui;padding:10px;margin-right:20px}#animation{width:120px;height:120px;background:#5264ff;border-radius:12px;position:absolute;top:320px;left:32px;animation:travel 2s linear infinite alternate}@keyframes travel{to{transform:translateX(950px) rotate(180deg)}}#hover{display:inline-block;padding:10px;background:#ddd}#hover:hover{background:#00d39a}#spacer{height:1400px}#destination{height:150px;background:#fff0bb}#drag{position:absolute;top:220px;left:700px;width:120px;height:50px;background:#ddd;cursor:grab;touch-action:none}</style>
<main><h2>Browse interaction benchmark</h2><p id="selection">Select this text by dragging across it.</p><input id="edit" placeholder="Type, select, replace, undo"><p><button id="count">Clicked 0</button><a href="#destination">Jump to destination</a><span id="hover">Hover me</span></p><div id="drag">Drag me</div><div id="animation"></div><div id="spacer"></div><div id="destination">Destination</div></main>
<script>let count=0;document.querySelector('#count').onclick=e=>e.target.textContent='Clicked '+(++count);let drag=false;const el=document.querySelector('#drag');el.onpointerdown=e=>{drag=true;el.setPointerCapture(e.pointerId)};el.onpointerup=()=>drag=false;el.onpointermove=e=>{if(drag){el.style.left=e.clientX-60+'px';el.style.top=e.clientY-25+'px'}};window.fixtureFrames=0;function tick(){fixtureFrames++;requestAnimationFrame(tick)}tick();</script>
